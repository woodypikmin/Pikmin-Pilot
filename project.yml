name: PikminPilot
options:
  bundleIdPrefix: com.woodypikmin
  deploymentTarget:
    iOS: '17.4'
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.4
targets:
  PikminPilot:
    type: application
    platform: iOS
    sources:
    - path: PikminPilot/ContentView.swift
    - path: PikminPilot/DeveloperDiskImageStore.swift
    - path: PikminPilot/FruitDetector.swift
    - path: PikminPilot/IDeviceEngine.swift
    - path: PikminPilot/ImageAutomationDetector.swift
    - path: PikminPilot/NoVPNSelfTransportProbe.swift
    - path: PikminPilot/PairingRecordStore.swift
    - path: PikminPilot/PikminPilotApp.swift
    - path: PikminPilot/PikminTunnelManager.swift
    - path: PikminPilot/PilotIDeviceBridge.h
    - path: PikminPilot/PilotIDeviceBridge.m
    - path: PikminPilot/PilotOptions.swift
    - path: PikminPilot/PilotTransport.swift
    - path: PikminPilot/RunnerPackageStore.swift
    - path: PikminPilot/Stage8FullLoopController.swift
    info:
      path: PikminPilot/Info.plist
    dependencies:
    - framework: Vendor/IDevice/IDevice.xcframework
    - sdk: Foundation.framework
    - sdk: Security.framework
    - sdk: Network.framework
    - sdk: NetworkExtension.framework
    - sdk: SystemConfiguration.framework
    - target: PikminPilotTunnel
      embed: true
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: PikminPilot/PikminPilot.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.woodypikmin.pikminpilot
        PRODUCT_NAME: PikminPilot
        TARGETED_DEVICE_FAMILY: '1,2'
        SWIFT_OBJC_BRIDGING_HEADER: PikminPilot/PikminPilot-Bridging-Header.h
        HEADER_SEARCH_PATHS:
        - $(inherited)
        - $(PROJECT_DIR)/PikminPilot
        - $(PROJECT_DIR)/Vendor/IDevice/IDevice.xcframework/ios-arm64/Headers
        OTHER_LDFLAGS:
        - $(inherited)
        - -lc++
        - -lz
        CODE_SIGN_STYLE: Manual
        CURRENT_PROJECT_VERSION: '1170'
        MARKETING_VERSION: '11.5.4.30'
    scheme:
      testTargets:
      - PikminPilotRunnerUITests
      management:
        shared: true
  PikminPilotTunnel:
    type: app-extension
    platform: iOS
    sources:
    - path: PikminPilotTunnel/PacketTunnelProvider.swift
    - path: PikminPilotTunnel/TunnelConstants.swift
    dependencies:
    - sdk: NetworkExtension.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.woodypikmin.pikminpilot.tunnel
        INFOPLIST_FILE: PikminPilotTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: PikminPilotTunnel/PikminPilotTunnel.entitlements
        PRODUCT_NAME: PikminPilotTunnel
        TARGETED_DEVICE_FAMILY: '1,2'
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_STYLE: Manual
        CURRENT_PROJECT_VERSION: '1170'
        MARKETING_VERSION: '11.5.4.30'
  PikminPilotRunnerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
    - path: PikminPilotRunnerUITests/PikminPilotRunnerUITests.swift
    dependencies:
    - target: PikminPilot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.woodypikmin.pikminpilot.runner
        PRODUCT_NAME: PikminPilotRunnerUITests
        TARGETED_DEVICE_FAMILY: '1,2'
        TEST_TARGET_NAME: PikminPilot
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: '1153'
        MARKETING_VERSION: '11.5.4.30'
