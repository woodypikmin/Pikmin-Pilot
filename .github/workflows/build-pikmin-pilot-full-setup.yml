name: Build Pikmin Pilot Full Windows Setup v2.3

on:
  workflow_dispatch:
    inputs:
      include_latest_signed_ipa:
        description: 'Bundle the latest successful build-ios.yml IPA into Setup'
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: windows-latest
    env:
      CARGO_NET_RETRY: '10'
      CARGO_HTTP_TIMEOUT: '180'
      CARGO_TERM_COLOR: always
      RUSTFLAGS: '-C target-feature=+crt-static'

    steps:
      - name: Checkout Pikmin Pilot repo
        uses: actions/checkout@v4
        with:
          path: pilot

      # Use checkout instead of direct source-archive HTTP downloads. This avoids the
      # transient 504 that killed v2.0 before compilation even started.
      - name: Checkout idevice_pair v1.1.0
        uses: actions/checkout@v4
        with:
          repository: jkcoxson/idevice_pair
          ref: v1.1.0
          path: _deps/idevice_pair
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout idevice
        uses: actions/checkout@v4
        with:
          repository: jkcoxson/idevice
          ref: master
          path: _deps/idevice
          fetch-depth: 1
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Patch and build pairing GUI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = '_deps\idevice_pair\src\known_apps.rs'
          if (-not (Test-Path $path)) { throw "known_apps.rs missing: $path" }
          $text = [IO.File]::ReadAllText($path)
          $needle = 'const REMOTE: &[KnownApp] = &['
          $entry = '    ("Pikmin Pilot", "rp_pairing_file.plist"),'
          $start = $text.IndexOf($needle, [StringComparison]::Ordinal)
          if ($start -lt 0) { throw 'REMOTE known-app table not found' }
          $end = $text.IndexOf('];', $start, [StringComparison]::Ordinal)
          if ($end -lt 0) { throw 'REMOTE table end not found' }
          $block = $text.Substring($start, $end - $start)
          if (-not $block.Contains('("Pikmin Pilot", "rp_pairing_file.plist")')) {
            $lineEnd = $text.IndexOf("`n", $start)
            if ($lineEnd -lt 0) { throw 'REMOTE table first line ending not found' }
            $text = $text.Insert($lineEnd + 1, $entry + "`n")
            [IO.File]::WriteAllText($path, $text, [Text.UTF8Encoding]::new($false))
          }
          $verify = [IO.File]::ReadAllText($path)
          if (-not $verify.Contains('("Pikmin Pilot", "rp_pairing_file.plist")')) {
            throw 'Pikmin Pilot pairing destination was not inserted'
          }
          Write-Host 'Pikmin Pilot pairing destination verified.'
          Push-Location _deps\idevice_pair
          rustc --version
          cargo --version
          cargo build --release
          Pop-Location
          $exe = '_deps\idevice_pair\target\release\idevice_pair.exe'
          if (-not (Test-Path $exe)) { throw 'idevice_pair.exe missing after build' }
          Write-Host "Pairing GUI: $exe"

      - name: Build idevice USB detector and IPA installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location _deps\idevice\tools
          git rev-parse HEAD
          rustc --version
          cargo --version
          # Match upstream's native tools build rather than using an ad-hoc
          # source ZIP or a fragile partial dependency configuration.
          cargo build --release --bin idevice-tools --bin idevice_id
          Pop-Location
          $toolsExe = '_deps\idevice\target\release\idevice-tools.exe'
          $idExe = '_deps\idevice\target\release\idevice_id.exe'
          if (-not (Test-Path $toolsExe)) { throw 'idevice-tools.exe missing' }
          if (-not (Test-Path $idExe)) { throw 'idevice_id.exe missing' }

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build visible WinForms PikminPilotSetup.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish pilot/WindowsBootstrap/PikminPilotSetup/PikminPilotSetup.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:PublishTrimmed=false `
            -o setup-publish
          if (-not (Test-Path 'setup-publish\PikminPilotSetup.exe')) { throw 'PikminPilotSetup.exe missing' }

      - name: Package bootstrap tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path out\tools | Out-Null
          Copy-Item setup-publish\PikminPilotSetup.exe out\PikminPilotSetup.exe
          Copy-Item pilot\WindowsBootstrap\START_HERE.cmd out\START_HERE.cmd
          Copy-Item pilot\WindowsBootstrap\setup-config.example.json out\setup-config.example.json
          Copy-Item pilot\WindowsBootstrap\README.md out\README.md
          Copy-Item pilot\WindowsBootstrap\CHECK_USB.cmd out\CHECK_USB.cmd
          Copy-Item _deps\idevice_pair\target\release\idevice_pair.exe out\tools\PikminPilotPairingSetup.exe
          Copy-Item _deps\idevice\target\release\idevice-tools.exe out\tools\idevice-tools.exe
          Copy-Item _deps\idevice\target\release\idevice_id.exe out\tools\idevice_id.exe

      - name: Bundle latest signed Pikmin Pilot IPA
        if: ${{ inputs.include_latest_signed_ipa }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location pilot
          $json = gh run list --workflow build-ios.yml --status success --limit 1 --json databaseId,displayTitle,createdAt
          $runs = $json | ConvertFrom-Json
          if (-not $runs -or $runs.Count -lt 1) {
            throw 'No successful build-ios.yml run found. Build Pikmin Pilot once first, then rerun this workflow.'
          }
          $runId = $runs[0].databaseId
          Write-Host "Downloading latest successful build-ios.yml artifacts from run $runId"
          Pop-Location
          New-Item -ItemType Directory -Force -Path ios-artifact | Out-Null
          Push-Location pilot
          gh run download $runId -D ..\ios-artifact
          Pop-Location
          # IMPORTANT: build-ios.yml uploads TWO IPAs: the real Pikmin Pilot host IPA
          # and a Runner-only IPA. Never select an arbitrary *.ipa here.
          $candidates = @(Get-ChildItem ios-artifact -Recurse -File | Where-Object {
            $_.Name -like 'PikminPilot-*-FULLY-SIGNED-DEVELOPMENT.ipa'
          })
          if ($candidates.Count -ne 1) {
            Write-Host 'IPA candidates found:'
            Get-ChildItem ios-artifact -Recurse -File -Filter *.ipa | Select-Object FullName, Length
            throw "Expected exactly one PikminPilot-*-FULLY-SIGNED-DEVELOPMENT.ipa, found $($candidates.Count)"
          }
          $ipa = $candidates[0]
          if ($ipa.Length -lt 100KB) { throw "IPA is unexpectedly small: $($ipa.FullName)" }
          Copy-Item $ipa.FullName out\PikminPilot.ipa
          Write-Host "Bundled HOST IPA: $($ipa.FullName) ($([math]::Round($ipa.Length/1MB, 1)) MB)"

          # Structural guard: the distributable IPA must contain PikminPilot.app at
          # Payload root. A Runner-only IPA has PikminPilotRunnerUITests-Runner.app
          # at Payload root and must NEVER be handed to Windows Setup.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path 'out\PikminPilot.ipa'))
          try {
            $names = @($zip.Entries | ForEach-Object { $_.FullName })
            if (-not ($names | Where-Object { $_ -eq 'Payload/PikminPilot.app/Info.plist' })) {
              throw 'Bundled IPA is not the Pikmin Pilot host app: Payload/PikminPilot.app/Info.plist missing'
            }
            if ($names | Where-Object { $_ -like 'Payload/PikminPilotRunnerUITests-Runner.app/*' }) {
              throw 'Runner-only IPA detected at Payload root; refusing to package it as PikminPilot.ipa'
            }
            if (-not ($names | Where-Object { $_ -like 'Payload/PikminPilot.app/*PikminPilotEmbeddedRunner.ipa' })) {
              throw 'Host IPA is missing embedded Runner resource'
            }
          } finally {
            $zip.Dispose()
          }
          Write-Host 'Host IPA structure verified: Payload/PikminPilot.app + embedded Runner.'

      - name: Bootstrap artifact self-check
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @(
            'out\PikminPilotSetup.exe',
            'out\START_HERE.cmd',
            'out\CHECK_USB.cmd',
            'out\tools\PikminPilotPairingSetup.exe',
            'out\tools\idevice-tools.exe',
            'out\tools\idevice_id.exe'
          )
          foreach ($f in $required) { if (-not (Test-Path $f)) { throw "Missing packaged file: $f" } }
          if ('${{ inputs.include_latest_signed_ipa }}' -eq 'true' -and -not (Test-Path 'out\PikminPilot.ipa')) {
            throw 'include_latest_signed_ipa=true but PikminPilot.ipa is missing'
          }
          Get-ChildItem out -Recurse | Select-Object FullName, Length

      - name: Upload full Windows Setup v2.3
        uses: actions/upload-artifact@v4
        with:
          name: PikminPilot-Full-Windows-Setup-v2.3
          path: out/
          if-no-files-found: error
