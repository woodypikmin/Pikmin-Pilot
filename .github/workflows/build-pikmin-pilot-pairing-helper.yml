name: Build Pikmin Pilot Pairing Helper for Windows

on:
  workflow_dispatch:

jobs:
  build-windows-helper:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Pikmin Pilot repo
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download idevice_pair v1.1.0
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest `
            -Uri 'https://github.com/jkcoxson/idevice_pair/archive/refs/tags/v1.1.0.zip' `
            -OutFile 'idevice_pair-v1.1.0.zip'
          Expand-Archive -Path 'idevice_pair-v1.1.0.zip' -DestinationPath '.' -Force
          if (-not (Test-Path 'idevice_pair-1.1.0\src')) {
            throw 'idevice_pair source directory not found after extraction'
          }

      - name: Patch Pikmin Pilot destination
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python WindowsPairingSetup/patch_idevice_pair.py idevice_pair-1.1.0/src
          Write-Host '--- Pikmin Pilot patch verification ---'
          Get-ChildItem idevice_pair-1.1.0/src -Recurse -Filter *.rs |
            Select-String -Pattern 'Pikmin Pilot|RP_PAIRING_FILE_NAME' |
            Select-Object -First 40 |
            ForEach-Object { Write-Host $_.Line }

      - name: Build release EXE
        shell: pwsh
        working-directory: idevice_pair-1.1.0
        run: cargo build --release --locked

      - name: Package helper
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path out | Out-Null
          if (-not (Test-Path 'idevice_pair-1.1.0\target\release\idevice_pair.exe')) {
            throw 'idevice_pair.exe was not produced'
          }
          Copy-Item 'idevice_pair-1.1.0\target\release\idevice_pair.exe' 'out\PikminPilotPairingSetup.exe'
          Copy-Item 'WindowsPairingSetup\USER_README.txt' 'out\README.txt'
          Copy-Item 'WindowsPairingSetup\THIRD_PARTY_NOTICE.txt' 'out\THIRD_PARTY_NOTICE.txt'

      - name: Upload Windows pairing helper
        uses: actions/upload-artifact@v4
        with:
          name: PikminPilot-Pairing-Setup-Windows-v1.1
          path: out/
          if-no-files-found: error
