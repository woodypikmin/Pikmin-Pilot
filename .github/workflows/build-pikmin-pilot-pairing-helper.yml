name: Build Pikmin Pilot Pairing Helper for Windows

on:
  workflow_dispatch:

jobs:
  build-windows-helper:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Pikmin Pilot repo
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download idevice_pair v1.1.0
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest `
            -Uri 'https://github.com/jkcoxson/idevice_pair/archive/refs/tags/v1.1.0.zip' `
            -OutFile 'idevice_pair-v1.1.0.zip'
          Expand-Archive -Path 'idevice_pair-v1.1.0.zip' -DestinationPath '.' -Force
          if (-not (Test-Path 'idevice_pair-1.1.0\src\known_apps.rs')) {
            throw 'idevice_pair v1.1.0 known_apps.rs not found after extraction'
          }

      - name: Add Pikmin Pilot Remote Pairing destination
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'idevice_pair-1.1.0\src\known_apps.rs'
          $text = [System.IO.File]::ReadAllText($path)

          $needle = 'const REMOTE: &[KnownApp] = &['
          $entry = '    ("Pikmin Pilot", "rp_pairing_file.plist"),'

          $remoteStart = $text.IndexOf($needle, [System.StringComparison]::Ordinal)
          if ($remoteStart -lt 0) {
            Write-Host '--- known_apps.rs ---'
            Write-Host $text
            throw 'Could not locate exact idevice_pair v1.1.0 REMOTE table opening'
          }

          $remoteEnd = $text.IndexOf('];', $remoteStart, [System.StringComparison]::Ordinal)
          if ($remoteEnd -lt 0) {
            throw 'Could not locate end of REMOTE table'
          }

          $remoteBlock = $text.Substring($remoteStart, $remoteEnd - $remoteStart)
          if ($remoteBlock.Contains('("Pikmin Pilot", "rp_pairing_file.plist")')) {
            Write-Host 'Pikmin Pilot REMOTE entry already present'
          } else {
            $lineEnd = $text.IndexOf("`n", $remoteStart)
            if ($lineEnd -lt 0 -or $lineEnd -gt $remoteEnd) {
              throw 'Could not locate first line ending after REMOTE table opening'
            }

            $insertPos = $lineEnd + 1
            $text = $text.Insert($insertPos, $entry + "`n")
            [System.IO.File]::WriteAllText(
              $path,
              $text,
              [System.Text.UTF8Encoding]::new($false)
            )
            Write-Host 'Inserted Pikmin Pilot directly into REMOTE table'
          }

          # Re-read from disk and verify that the tuple is physically inside REMOTE.
          $verify = [System.IO.File]::ReadAllText($path)
          $verifyStart = $verify.IndexOf($needle, [System.StringComparison]::Ordinal)
          $verifyEnd = $verify.IndexOf('];', $verifyStart, [System.StringComparison]::Ordinal)
          if ($verifyStart -lt 0 -or $verifyEnd -lt 0) {
            throw 'Verification could not locate REMOTE table'
          }
          $verifyBlock = $verify.Substring($verifyStart, $verifyEnd - $verifyStart)
          if (-not $verifyBlock.Contains('("Pikmin Pilot", "rp_pairing_file.plist")')) {
            throw 'Pikmin Pilot REMOTE tuple was not inserted'
          }

          Write-Host '--- verified REMOTE table ---'
          Write-Host $verifyBlock
          Write-Host 'Pikmin Pilot Remote Pairing destination verified.'

      - name: Build release EXE
        shell: pwsh
        working-directory: idevice_pair-1.1.0
        run: cargo build --release --locked

      - name: Package helper
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path out | Out-Null
          if (-not (Test-Path 'idevice_pair-1.1.0\target\release\idevice_pair.exe')) {
            throw 'idevice_pair.exe was not produced'
          }
          Copy-Item 'idevice_pair-1.1.0\target\release\idevice_pair.exe' 'out\PikminPilotPairingSetup.exe'
          if (Test-Path 'WindowsPairingSetup\USER_README.txt') {
            Copy-Item 'WindowsPairingSetup\USER_README.txt' 'out\README.txt'
          }
          if (Test-Path 'WindowsPairingSetup\THIRD_PARTY_NOTICE.txt') {
            Copy-Item 'WindowsPairingSetup\THIRD_PARTY_NOTICE.txt' 'out\THIRD_PARTY_NOTICE.txt'
          }

      - name: Upload Windows pairing helper
        uses: actions/upload-artifact@v4
        with:
          name: PikminPilot-Pairing-Setup-Windows-v1.4
          path: out/
          if-no-files-found: error
