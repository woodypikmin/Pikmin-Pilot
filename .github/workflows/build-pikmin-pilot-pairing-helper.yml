name: Build Pikmin Pilot Pairing Helper for Windows

on:
  workflow_dispatch:

jobs:
  build-windows-helper:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Pikmin Pilot repo
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download idevice_pair v1.1.0
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest `
            -Uri 'https://github.com/jkcoxson/idevice_pair/archive/refs/tags/v1.1.0.zip' `
            -OutFile 'idevice_pair-v1.1.0.zip'
          Expand-Archive -Path 'idevice_pair-v1.1.0.zip' -DestinationPath '.' -Force
          if (-not (Test-Path 'idevice_pair-1.1.0\src\known_apps.rs')) {
            throw 'idevice_pair v1.1.0 known_apps.rs not found after extraction'
          }

      - name: Patch Pikmin Pilot Remote Pairing destination
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host '--- upstream v1.1.0 known_apps.rs ---'
          Get-Content idevice_pair-1.1.0/src/known_apps.rs

          python WindowsPairingSetup/patch_idevice_pair.py idevice_pair-1.1.0/src

          Write-Host '--- patched REMOTE table ---'
          $content = Get-Content idevice_pair-1.1.0/src/known_apps.rs -Raw
          if ($content -notmatch '\("Pikmin Pilot",\s*"rp_pairing_file\.plist"\)') {
            throw 'Pikmin Pilot REMOTE tuple was not inserted'
          }
          Get-Content idevice_pair-1.1.0/src/known_apps.rs | Select-String -Pattern 'REMOTE|Pikmin Pilot|Auto Capture|StikDebug' -Context 1,2 | ForEach-Object { Write-Host $_.ToString() }

      - name: Build release EXE
        shell: pwsh
        working-directory: idevice_pair-1.1.0
        run: cargo build --release --locked

      - name: Package helper
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path out | Out-Null
          if (-not (Test-Path 'idevice_pair-1.1.0\target\release\idevice_pair.exe')) {
            throw 'idevice_pair.exe was not produced'
          }
          Copy-Item 'idevice_pair-1.1.0\target\release\idevice_pair.exe' 'out\PikminPilotPairingSetup.exe'
          Copy-Item 'WindowsPairingSetup\USER_README.txt' 'out\README.txt'
          Copy-Item 'WindowsPairingSetup\THIRD_PARTY_NOTICE.txt' 'out\THIRD_PARTY_NOTICE.txt'

      - name: Upload Windows pairing helper
        uses: actions/upload-artifact@v4
        with:
          name: PikminPilot-Pairing-Setup-Windows-v1.3
          path: out/
          if-no-files-found: error
