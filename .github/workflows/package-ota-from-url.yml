name: Package Pikmin Pilot OTA Site

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: Direct HTTPS URL to a signed Pikmin Pilot IPA
        required: true
        type: string
      public_base_url:
        description: Public HTTPS folder URL where the generated site will be hosted
        required: true
        type: string

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Download signed IPA
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$IPA_URL" -o PikminPilot-signed.ipa
          test -s PikminPilot-signed.ipa

      - name: Build OTA static site
        env:
          BASE_URL: ${{ inputs.public_base_url }}
        run: |
          python3 OTA/make_ota_package.py \
            --ipa PikminPilot-signed.ipa \
            --base-url "$BASE_URL" \
            --output ota-site

      - name: Upload OTA site
        uses: actions/upload-artifact@v4
        with:
          name: PikminPilot-OTA-SITE
          path: ota-site/
          if-no-files-found: error
