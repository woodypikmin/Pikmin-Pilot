name: RC6 Dynamic Provision + Re-sign Pikmin Pilot

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Cloud provisioning job id
        required: true
        type: string
      backend_url:
        description: HTTPS callback URL for this provisioning job
        required: true
        type: string
      app_version:
        description: App version snapshotted by backend release.json
        required: true
        type: string
      baseline_repo:
        description: Public B repo containing the known-good IPA release
        required: true
        type: string
      baseline_release_tag:
        description: Release tag containing the known-good IPA
        required: true
        type: string
      baseline_ipa_asset:
        description: Exact IPA asset filename
        required: true
        type: string

permissions:
  contents: read

jobs:
  sign:
    runs-on: macos-15
    env:
      JOB_ID: ${{ inputs.job_id }}
      BACKEND_URL: ${{ inputs.backend_url }}
      BACKEND_TOKEN: ${{ secrets.PIKMIN_BACKEND_WORKFLOW_TOKEN }}
      APP_VERSION: ${{ inputs.app_version }}
      BASELINE_REPO: ${{ inputs.baseline_repo }}
      BASELINE_RELEASE_TAG: ${{ inputs.baseline_release_tag }}
      BASELINE_IPA_ASSET: ${{ inputs.baseline_ipa_asset }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate dynamic release inputs
        shell: bash
        run: |
          set -euo pipefail
          case "$BACKEND_URL" in
            https://*) ;;
            *) echo "backend_url must be HTTPS" >&2; exit 2 ;;
          esac
          test -n "$BACKEND_TOKEN"
          [[ "$BASELINE_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "invalid baseline_repo" >&2; exit 2; }
          [[ "$BASELINE_RELEASE_TAG" =~ ^[A-Za-z0-9._+-]+$ ]] || { echo "invalid baseline_release_tag" >&2; exit 2; }
          [[ "$BASELINE_IPA_ASSET" == *.ipa ]] || { echo "baseline_ipa_asset must end in .ipa" >&2; exit 2; }
          case "$BASELINE_IPA_ASSET" in */*) echo "baseline_ipa_asset must be a filename, not a path" >&2; exit 2;; esac
          echo "App version:  $APP_VERSION"
          echo "Release repo: $BASELINE_REPO"
          echo "Release tag:  $BASELINE_RELEASE_TAG"
          echo "IPA asset:    $BASELINE_IPA_ASSET"

      - name: Download dynamic known-good IPA from public B repo Release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          URL="https://github.com/${BASELINE_REPO}/releases/download/${BASELINE_RELEASE_TAG}/${BASELINE_IPA_ASSET}"
          echo "Download URL: $URL"
          curl --fail --location --show-error --silent \
            --retry 4 --retry-all-errors \
            "$URL" -o work/baseline.ipa
          test -s work/baseline.ipa
          echo "Downloaded bytes: $(stat -f%z work/baseline.ipa)"
          shasum -a 256 work/baseline.ipa

      - name: Download App / Tunnel / Runner Development profiles
        shell: bash
        run: |
          set -euo pipefail
          for label in app tunnel runner; do
            curl --fail --show-error --silent \
              --retry 4 --retry-all-errors \
              -H "Authorization: Bearer $BACKEND_TOKEN" \
              "$BACKEND_URL/internal/jobs/$JOB_ID/profiles/$label" \
              -o "work/$label.mobileprovision"
            test -s "work/$label.mobileprovision"
          done

      - name: Import existing Apple Development P12 into temporary keychain
        env:
          P12_B64: ${{ secrets.APPLE_DEV_P12_B64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEV_P12_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$P12_B64"
          python3 - <<'PY'
          import base64, os
          raw = ''.join(os.environ['P12_B64'].split())
          open('work/signing.p12', 'wb').write(base64.b64decode(raw, validate=True))
          PY
          KEYCHAIN="$RUNNER_TEMP/pikminpilot-rc6.keychain-db"
          KEYCHAIN_PASS="$(openssl rand -hex 24)"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security import work/signing.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n '1s/.*"\(.*\)".*/\1/p')"
          test -n "$IDENTITY"
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "Using identity: $IDENTITY"

      - name: Verify hardened signing script revision and Bash syntax
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT=CloudProvisioning/scripts/rc5_resign_ipa.sh
          test -s "$SCRIPT"
          grep -F "RC5_SIGN_SCRIPT_REVISION='2026-09-16.4-nounset-hardened'" "$SCRIPT"
          grep -F 'local decoded="$WORK/profile-${label}.plist"' "$SCRIPT" >/dev/null
          bash -n "$SCRIPT"
          echo "Signing script SHA256: $(shasum -a 256 "$SCRIPT" | awk '{print $1}')"

      - name: Re-sign dynamic payload while preserving target entitlements
        env:
          INPUT_IPA: ${{ github.workspace }}/work/baseline.ipa
          OUTPUT_IPA: ${{ github.workspace }}/work/PikminPilot.ipa
          PROFILE_APP: ${{ github.workspace }}/work/app.mobileprovision
          PROFILE_TUNNEL: ${{ github.workspace }}/work/tunnel.mobileprovision
          PROFILE_RUNNER: ${{ github.workspace }}/work/runner.mobileprovision
        shell: bash
        run: |
          set -euo pipefail
          echo "--- invoking hardened signer for Pikmin Pilot $APP_VERSION ---"
          set +e
          bash CloudProvisioning/scripts/rc5_resign_ipa.sh
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "Signer failed (exit=$rc). The signer log above contains the exact failing line/command." >&2
            exit "$rc"
          fi
          echo '--- output handoff check ---'
          IPA="${{ github.workspace }}/work/PikminPilot.ipa"
          ls -lah "${{ github.workspace }}/work"
          test -s "$IPA" || { echo "Signed IPA missing after successful signer: $IPA" >&2; exit 1; }
          echo "Signed IPA bytes: $(stat -f%z "$IPA")"
          shasum -a 256 "$IPA"

      - name: Upload signed IPA to provisioning backend
        shell: bash
        run: |
          set -euo pipefail
          IPA="${{ github.workspace }}/work/PikminPilot.ipa"
          echo '--- upload input check ---'
          ls -lah "${{ github.workspace }}/work"
          test -s "$IPA" || { echo "Signed IPA missing: $IPA" >&2; exit 1; }
          SHA="$(shasum -a 256 "$IPA" | awk '{print $1}')"
          curl --fail --show-error --silent \
            --retry 4 --retry-all-errors \
            -X PUT \
            -H "Authorization: Bearer $BACKEND_TOKEN" \
            -H "X-IPA-SHA256: $SHA" \
            -H 'Content-Type: application/octet-stream' \
            --data-binary "@$IPA" \
            "$BACKEND_URL/internal/jobs/$JOB_ID/result"
          echo "Uploaded Pikmin Pilot $APP_VERSION SHA256=$SHA"

      - name: Report failure to backend
        if: failure()
        shell: bash
        run: |
          curl --show-error --silent \
            -X POST \
            -H "Authorization: Bearer $BACKEND_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{"message":"A repo dynamic signing workflow failed; inspect the GitHub Actions run."}' \
            "$BACKEND_URL/internal/jobs/$JOB_ID/failed" || true
